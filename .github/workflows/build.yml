name: Build

on: 
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
    
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
    
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend
    
      - name: Build frontend
        run: npm run build
        working-directory: ./frontend

  build-backend:
      runs-on: ubuntu-latest
      steps:
      - name: Checkout code
        uses: actions/checkout@v4
    
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: MigrantSupportPlatform-Node/package-lock.json
    
      - name: Install backend dependencies
        run: npm ci
        working-directory: ./MigrantSupportPlatform-Node
    
      - name: Build backend
        run: npm run build
        working-directory: ./MigrantSupportPlatform-Node