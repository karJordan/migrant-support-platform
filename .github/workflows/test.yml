name: Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: MigrantSupportPlatform-Node/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: ./MigrantSupportPlatform-Node

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U testuser; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting... (attempt $i)"
            sleep 2
          done

      - name: Test PostgreSQL connection
        run: |
          PGPASSWORD=testpassword psql -h localhost -U testuser -d testdb -c "SELECT 1"
        working-directory: ./MigrantSupportPlatform-Node
        env:
          PGPASSWORD: testpassword
          PGHOST: localhost
          PGUSER: testuser
          PGDATABASE: testdb
          PGPORT: 5432

      - name: Run database migrations
        run: npm run migrate
        working-directory: ./MigrantSupportPlatform-Node
        env:
          DATABASE_URL: postgres://testuser:testpassword@localhost:5432/testdb
          PGHOST: localhost
          PGUSER: testuser
          PGPASSWORD: testpassword
          PGDATABASE: testdb
          PGPORT: 5432

      - name: Debug - Check tables
        run: |
          PGPASSWORD=testpassword psql -h localhost -U testuser -d testdb -c "\dt"
        working-directory: ./MigrantSupportPlatform-Node
        env:
          PGPASSWORD: testpassword
          PGHOST: localhost
          PGUSER: testuser
          PGDATABASE: testdb
          PGPORT: 5432

      - name: Run tests
        run: npm test
        working-directory: ./MigrantSupportPlatform-Node
        env:
          DATABASE_URL: postgres://testuser:testpassword@localhost:5432/testdb
          NODE_ENV: test
          JWT_SECRET: test-secret-key
          PGHOST: localhost
          PGUSER: testuser
          PGPASSWORD: testpassword
          PGDATABASE: testdb
          PGPORT: 5432

  e2e-tests:
    runs-on: ubuntu-latest
    needs: test-backend
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install backend dependencies
      run: npm ci
      working-directory: ./MigrantSupportPlatform-Node

    - name: Run Database migrations
      run: npm run migrate
      working-directory: ./MigrantSupportPlatform-Node
      env:
        DATABASE_URL: postgres://testuser:testpassword@localhost:5432/testdb
        PGHOST: localhost
        PGUSER: testuser
        PGPASSWORD: testpassword
        PGDATABASE: testdb
        PGPORT: 5432

    - name: Run backend seeds
      run: npm run seed
      working-directory: ./MigrantSupportPlatform-Node
      env:
        DATABASE_URL: postgres://testuser:testpassword@localhost:5432/testdb
        PGHOST: localhost
        PGUSER: testuser
        PGPASSWORD: testpassword
        PGDATABASE: testdb
        PGPORT: 5432

    - name: Start backend server
      run: npm run dev &
      working-directory: ./MigrantSupportPlatform-Node
      env:
        DATABASE_URL: postgres://testuser:testpassword@localhost:5432/testdb
        NODE_ENV: test
        JWT_SECRET: test-secret-key
        PGHOST: localhost
        PGUSER: testuser
        PGPASSWORD: testpassword
        PGDATABASE: testdb
        PGPORT: 5432

    - name: Install frontend dependencies
      run: npm ci
      working-directory: ./frontend

    - name: Install playwright browsers
      run: npx playwright install --with-deps
      working-directory: ./frontend

    - name: Build frontend
      run: npm run build
      working-directory: ./frontend

    - name: Start frontend server
      run: npm run dev &
      working-directory: ./frontend
      env:
        NEXT_PUBLIC_API_URL: http://localhost:4000

    - name: Wait for backend server to be ready
      run: |
        echo "Waiting for backend server to be ready..."
        for i in {1..10}; do
          if curl -s http://localhost:4000/health; then
            echo "Backend server is ready!"
            break
          fi
          echo "Waiting... (attempt $i)"
          sleep 2
        done

    - name: Wait for frontend server to be ready
      run: |
        echo "Waiting for frontend server to be ready..."
        for i in {1..10}; do
          if curl -s http://localhost:3000; then
            echo "Frontend server is ready!"
            break
          fi
          echo "Waiting... (attempt $i)"
          sleep 2
        done

    - name: Run E2E Tests
      run: npm run test:e2e
      working-directory: ./frontend
      env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:4000
          NEXTAUTH_URL: http://localhost:3000  
          JWT_SECRET: test-secret-key          
          NODE_ENV: test 

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: ./frontend/playwright-report
        retention-days: 5