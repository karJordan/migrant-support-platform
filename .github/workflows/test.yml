name: Test

on: 
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
    test-backend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '22'
                cache: 'npm'
                cache-dependency-path: MigrantSupportPlatform-Node/package-lock.json

            - name: Install backend dependencies
              run: npm ci
              working-directory: ./MigrantSupportPlatform-Node

            - name: Run backend tests
              run: npm test
              working-directory: ./MigrantSupportPlatform-Node

